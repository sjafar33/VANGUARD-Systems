<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A3FA8"/>
      <stop offset="0.55" stop-color="#1B2A6B"/>
      <stop offset="1" stop-color="#0B1426"/>
    </linearGradient>
    <radialGradient id="halo" cx="512" cy="520" r="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6FE6F2" stop-opacity="0.45"/>
      <stop offset="0.55" stop-color="#53C6D7" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#53C6D7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E4E9EF"/>
      <stop offset="0.45" stop-color="#B9C1CD"/>
      <stop offset="1" stop-color="#8A94A4"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#EEF2F6"/>
      <stop offset="1" stop-color="#C9D2DD"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22325A"/>
      <stop offset="1" stop-color="#0F1A33"/>
    </linearGradient>
    <radialGradient id="earth" cx="0.38" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#7FD4FF"/>
      <stop offset="0.6" stop-color="#2E7FD1"/>
      <stop offset="1" stop-color="#174A8C"/>
    </radialGradient>
    <radialGradient id="gold" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#FFF3C4"/>
      <stop offset="0.5" stop-color="#FFC94D"/>
      <stop offset="1" stop-color="#E89A1C"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="earthclip"><circle cx="820" cy="210" r="92"/></clipPath>
  </defs>

  <!-- Sky -->
  <rect width="1024" height="1024" fill="url(#sky)"/>
  <!-- Stars -->
  <g fill="#FFFFFF">
    <circle cx="140" cy="150" r="5" opacity="0.9"/>
    <circle cx="250" cy="90" r="3" opacity="0.7"/>
    <circle cx="96" cy="330" r="3.5" opacity="0.8"/>
    <circle cx="330" cy="200" r="2.5" opacity="0.6"/>
    <circle cx="640" cy="110" r="3" opacity="0.7"/>
    <circle cx="930" cy="400" r="4" opacity="0.8"/>
    <circle cx="700" cy="250" r="2.5" opacity="0.6"/>
    <circle cx="190" cy="470" r="2.5" opacity="0.6"/>
    <circle cx="880" cy="540" r="3" opacity="0.7"/>
    <circle cx="460" cy="70" r="2.5" opacity="0.6"/>
  </g>
  <!-- Sparkle stars -->
  <g fill="#FFE27A" filter="url(#softglow)">
    <path d="M200 250 L210 280 L240 290 L210 300 L200 330 L190 300 L160 290 L190 280 Z"/>
    <path d="M905 640 L911 660 L931 666 L911 672 L905 692 L899 672 L879 666 L899 660 Z"/>
  </g>
  <!-- Earth -->
  <g>
    <circle cx="820" cy="210" r="104" fill="#7FD4FF" opacity="0.18"/>
    <circle cx="820" cy="210" r="92" fill="url(#earth)"/>
    <g clip-path="url(#earthclip)" fill="#6BCB77">
      <path d="M760 170 C780 140 820 150 830 175 C840 200 805 205 795 225 C785 245 755 235 752 210 C750 195 752 182 760 170 Z"/>
      <path d="M850 230 C870 220 900 235 895 260 C890 285 860 290 845 275 C835 262 838 238 850 230 Z"/>
      <path d="M840 140 C855 132 875 138 872 150 C868 162 850 160 842 154 Z"/>
    </g>
    
  </g>

  <!-- Halo behind Nova -->
  <circle cx="512" cy="520" r="430" fill="url(#halo)"/>

  <!-- Moon surface -->
  <ellipse cx="512" cy="1290" rx="980" ry="520" fill="url(#moon)"/>
  <ellipse cx="512" cy="1290" rx="980" ry="520" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="6"/>
  <g>
    <ellipse cx="150" cy="905" rx="70" ry="22" fill="#8F99A9"/>
    <ellipse cx="146" cy="900" rx="60" ry="16" fill="#7D8798"/>
    <ellipse cx="880" cy="930" rx="90" ry="26" fill="#8F99A9"/>
    <ellipse cx="875" cy="924" rx="78" ry="19" fill="#7D8798"/>
    <ellipse cx="640" cy="975" rx="48" ry="14" fill="#8F99A9"/>
    <ellipse cx="300" cy="985" rx="36" ry="11" fill="#8F99A9"/>
  </g>

  <!-- Nova's shadow on the Moon -->
  <ellipse cx="530" cy="842" rx="270" ry="40" fill="#0B1426" opacity="0.25"/>

  <!-- Nova -->
  <g>
    <!-- antenna -->
    <line x1="512" y1="300" x2="512" y2="196" stroke="#6E7A8B" stroke-width="22" stroke-linecap="round"/>
    <circle cx="512" cy="182" r="46" fill="url(#gold)" filter="url(#glow)"/>
    <circle cx="498" cy="168" r="13" fill="#FFFFFF" opacity="0.8"/>
    <!-- head lip -->
    <rect x="252" y="296" width="520" height="530" rx="200" fill="#8794A6"/>
    <!-- head -->
    <rect x="252" y="276" width="520" height="530" rx="200" fill="url(#head)"/>
    <ellipse cx="380" cy="360" rx="110" ry="50" fill="#FFFFFF" opacity="0.7" transform="rotate(-20 380 360)"/>
    <!-- visor -->
    <rect x="318" y="396" width="388" height="300" rx="120" fill="url(#visor)"/>
    <rect x="318" y="396" width="388" height="300" rx="120" fill="none" stroke="#3B4C77" stroke-width="6"/>
    <!-- eyes -->
    <g fill="#6FE6F2" filter="url(#glow)">
      <rect x="400" y="470" width="64" height="112" rx="32"/>
      <rect x="560" y="470" width="64" height="112" rx="32"/>
    </g>
    <g fill="#FFFFFF" opacity="0.85">
      <rect x="414" y="484" width="18" height="30" rx="9"/>
      <rect x="574" y="484" width="18" height="30" rx="9"/>
    </g>
    <!-- smile -->
    <path d="M462 628 Q512 668 562 628" fill="none" stroke="#6FE6F2" stroke-width="16" stroke-linecap="round" filter="url(#softglow)"/>
    <!-- cheek lights -->
    <circle cx="290" cy="560" r="20" fill="#FFC94D" filter="url(#softglow)"/>
    <circle cx="734" cy="560" r="20" fill="#FFC94D" filter="url(#softglow)"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
